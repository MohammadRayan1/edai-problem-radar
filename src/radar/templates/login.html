{% extends "base.html" %}
{% block title %}Sign in — EdAI Problem Radar{% endblock %}
{% block content %}
<div class="panel" style="max-width: 380px; margin: 3rem auto 0;">
  <h2 style="margin-top:0;">Sign in</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Password" autofocus required style="margin-bottom: 1rem;">
    <input type="submit" value="Sign in" class="primary" style="width:100%;">
  </form>
</div>
{% endblock %}
