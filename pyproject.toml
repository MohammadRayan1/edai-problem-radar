[project]
name = "edai-problem-radar"
version = "0.1.0"
description = "EdAI Problem Radar - research, script, and video pipeline"
requires-python = ">=3.11"
dependencies = [
    "tavily-python>=0.5",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "moviepy>=2.0",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "cairosvg>=2.7",
    "Pillow>=10.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
